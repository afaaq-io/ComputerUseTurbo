[package]
name = "turbo-helper"
description = "Computer Use Turbo helper for Windows and Linux"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "computer-use-turbo-helper"
path = "src/main.rs"

[dependencies]
turbo-core = { path = "../core" }
serde_json = "1"
log = "0.4"
# The agent pointer, drawn in software.
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
eframe = { version = "=0.29.1", default-features = false, features = ["glow", "default_fonts"] }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
# The `implement` macro (UI Automation event handlers) refers to windows-core by name.
windows-core = "=0.58.0"
windows = { version = "=0.58.0", features = [
    "implement",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Packaging_Appx",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_StationsAndDesktops",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "4", default-features = false, features = ["async-io"] }
libc = "0.2"
x11rb = { version = "0.13", features = ["xtest", "screensaver", "xinput", "randr", "shape"] }
# Wayland: window frames over PipeWire, input through EIS (libei protocol), keymaps.
pipewire = "0.10"
reis = "0.7"
xkbcommon = { version = "0.9", default-features = false }
rustix = { version = "1", features = ["event", "time"] }
# The helper windows run as X11 (XWayland) windows in Wayland sessions; same winit as eframe.
winit = { version = "0.30", default-features = false, features = ["x11"] }
eframe = { version = "=0.29.1", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
